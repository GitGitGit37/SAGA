[project]
name = "cat-track"
version = "0.1.0"
description = "Cat Track: a persistent, self-improving memory layer for physical assets"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pyyaml>=6",
    "numpy>=2",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "anthropic>=0.40",
    "google-genai>=1.30",
    "fastembed>=0.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "seed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
